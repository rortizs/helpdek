[project]
name= "helpdesk-edu"
version = "0.1.0"
description = "A HelpDesk EDU application"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 22/10/2026 - Semana 17: separo las pruebas por costo. `integration` = necesita PostgreSQL real
# (se marca sola en tests/conftest.py a toda prueba que use la base). El resto son unitarias.
#   uv run pytest -m "not integration"    # rapidas, sin base de datos
#   uv run pytest -m integration          # contra PostgreSQL (TEST_DATABASE_URL)
markers = [
    "integration: usa PostgreSQL real a traves de TEST_DATABASE_URL (pg_engine, db o committed_db)",
]
