[project]
name= "helpdesk-edu"
version = "0.1.0"
description = "A HelpDesk EDU application"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
