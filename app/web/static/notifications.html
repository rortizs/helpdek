<!doctype html>
<!--
  22/10/2026 - Richard Ortiz: AVISOS (notificaciones) sin leer del usuario (semana 16). Llama a GET /api/notifications
  y, con el boton, a POST /api/notifications/read-all. Cada aviso enlaza al ticket del que habla. La API solo
  entrega los avisos de quien tiene la sesion abierta, nunca los de otra persona. Logica en js/pages/notifications.js.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avisos · HelpDesk EDU</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header id="site-nav"></header>
  <main id="main" class="container py-4">
    <h1 id="page-title" tabindex="-1" class="h3 mb-3">Avisos</h1>
    <div id="alert-region" aria-live="assertive" aria-atomic="true"></div>
    <noscript><div class="alert alert-warning" role="alert">Este cliente necesita JavaScript para funcionar.</div></noscript>
    <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
      <p id="notifications-summary" class="mb-0 text-body-secondary" role="status"></p>
      <button type="button" class="btn btn-outline-primary" id="read-all" disabled>Marcar todo como leído</button>
    </div>
    <div id="notifications-list"></div>
  </main>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/notifications.js"></script>
</body>
</html>
