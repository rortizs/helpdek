<!doctype html>
<!--
  22/10/2026 - Richard Ortiz: LISTA de tickets (semana 16). Llama a GET /api/tickets con los filtros y la
  paginacion que expone la API (status, category, priority, limit, offset) y lee el total del encabezado
  X-Total-Count. Un solicitante recibe solo sus tickets; el personal de soporte recibe todos: eso lo decide la
  API, no esta pagina. Se dibuja como TABLA en pantallas medianas y grandes, y como TARJETAS en el telefono.
  Toda la logica esta en js/pages/tickets.js.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets · HelpDesk EDU</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header id="site-nav"></header>
  <main id="main" class="container py-4">
    <h1 id="page-title" tabindex="-1" class="h3 mb-3">Tickets</h1>
    <div id="alert-region" aria-live="assertive" aria-atomic="true"></div>
    <noscript><div class="alert alert-warning" role="alert">Este cliente necesita JavaScript para funcionar.</div></noscript>
    <form id="filters" class="card card-body mb-3" novalidate aria-labelledby="filters-title">
      <h2 id="filters-title" class="h6 mb-3">Filtrar</h2>
      <div class="row g-3 align-items-end">
        <div class="col-12 col-sm-6 col-lg-3">
          <label for="filter-status" class="form-label">Estado</label>
          <select id="filter-status" name="status" class="form-select"></select>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <label for="filter-category" class="form-label">Categoría</label>
          <select id="filter-category" name="category" class="form-select"></select>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <label for="filter-priority" class="form-label">Prioridad</label>
          <select id="filter-priority" name="priority" class="form-select"></select>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary flex-fill" id="filters-apply">Aplicar</button>
          <button type="button" class="btn btn-outline-secondary" id="filters-reset">Limpiar</button>
        </div>
        <div class="col-12 d-none" id="mine-group">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="filter-mine" name="mine">
            <label class="form-check-label" for="filter-mine">Solo los asignados a mí</label>
          </div>
        </div>
      </div>
    </form>

    <p id="results-summary" class="text-body-secondary small mb-2" role="status"></p>
    <div id="results"></div>
    <nav id="pagination" aria-label="Paginación de tickets" class="mt-3"></nav>
  </main>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/tickets.js"></script>
</body>
</html>
