<!doctype html>
<!--
  22/10/2026 - Richard Ortiz: formulario de ALTA de ticket (semana 16). Valida en el navegador las mismas reglas
  que la API (titulo de 3 a 160 caracteres, descripcion, categoria y prioridad de las listas) para avisar
  rapido, y manda los datos a POST /api/tickets. Si la API responde 422, los errores del servidor se muestran
  junto a cada campo: la API es la autoridad, esta validacion es solo comodidad. Logica en js/pages/ticket-new.js.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo ticket · HelpDesk EDU</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header id="site-nav"></header>
  <main id="main" class="container py-4">
    <h1 id="page-title" tabindex="-1" class="h3 mb-3">Nuevo ticket</h1>
    <div id="alert-region" aria-live="assertive" aria-atomic="true"></div>
    <noscript><div class="alert alert-warning" role="alert">Este cliente necesita JavaScript para funcionar.</div></noscript>
    <form id="ticket-form" class="card card-body" novalidate aria-labelledby="page-title">
      <div class="mb-3">
        <label for="title" class="form-label">Título</label>
        <input type="text" class="form-control" id="title" name="title" autocomplete="off" required>
        <div class="form-text">Entre 3 y 160 caracteres. Resume el problema en una frase.</div>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Descripción</label>
        <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
        <div class="form-text">Cuenta qué pasó, dónde y desde cuándo.</div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6">
          <label for="category" class="form-label">Categoría</label>
          <select id="category" name="category" class="form-select" required></select>
        </div>
        <div class="col-12 col-sm-6">
          <label for="priority" class="form-label">Prioridad</label>
          <select id="priority" name="priority" class="form-select" required></select>
        </div>
      </div>
      <div class="d-flex flex-column flex-sm-row gap-2">
        <button type="submit" class="btn btn-primary" id="ticket-submit">Crear ticket</button>
        <a class="btn btn-outline-secondary" href="tickets.html">Cancelar</a>
      </div>
    </form>
  </main>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pages/ticket-new.js"></script>
</body>
</html>
